[project]
name = "farmvalue"
version = "0.1.0"
description = "MLflow-пайплайн для Kaggriculture: датасет из реплеев, модель вероятности победы и реестр агентов"
readme = "README.md"
authors = [
    { name = "smirnolegov", email = "probasket119@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
agents = [
    "kaggle-environments==1.32.7",
]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "ruff>=0.17.0",
]
ml = [
    "matplotlib>=3.11.2",
    "mlflow>=3.17.0",
    "pyarrow>=25.0.1",
]
serve = [
    "mlflow-skinny>=3.17.0",
    "pandas>=3.0.6",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.1",
    "skops>=0.16.0",
]

[tool.uv]
default-groups = ["serve", "ml", "agents", "dev"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "N", "B", "ASYNC", "S", "BLE", "ANN", "SIM", "PT", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["farmvalue"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["mlflow.*", "sklearn.*", "kaggle_environments.*", "matplotlib.*"]
ignore_missing_imports = true
