receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Первым: при нехватке памяти отказывает приёмнику, и SDK сам повторит отправку позже.
  # Лимиты в MiB под mem_limit 192m контейнера
  memory_limiter:
    check_interval: 1s
    limit_mib: 150
    spike_limit_mib: 40
  batch:
    send_batch_size: 1024
    timeout: 2s

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # Prometheus забирает метрики отсюда. Ряды процесса, который перестал присылать
  # метрики, держатся metric_expiration: так счётчики источника видны и после конца пакета
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true
    metric_expiration: 5m

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
  telemetry:
    logs:
      level: warn
