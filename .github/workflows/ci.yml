name: CI

# Когда запускается:
# - pull_request — каждое изменение проверяется до мержа;
# - push в любую ветку, кроме main — быстрый фидбек на рабочих ветках;
# - workflow_call — CD вызывает этот же workflow перед публикацией образа.
#   Поэтому push в main и теги проверяются ровно один раз (внутри CD), без дублей.
on:
  pull_request:
  push:
    branches-ignore: [main]
    tags-ignore: ["**"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: Lint & format & types (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      # Те же хуки, что и локально: ruff check/format, mypy, hadolint,
      # editorconfig, пробелы/EOF, размер файлов, синхронность uv.lock, схемы workflow.
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # sqlite  — герметичный прогон, как у разработчика локально;
        # postgres — тот же набор против настоящих Postgres и Redis + проверка миграций.
        backend: [sqlite, postgres]
    services:
      postgres:
        image: ${{ matrix.backend == 'postgres' && 'postgres:17-alpine' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rl_arena
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: ${{ matrix.backend == 'postgres' && 'redis:8-alpine' || '' }}
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync

      - name: Configure real backends
        if: matrix.backend == 'postgres'
        run: |
          echo "DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/rl_arena" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/rl_arena" >> "$GITHUB_ENV"
          echo "TEST_REDIS_URL=redis://localhost:6379/0" >> "$GITHUB_ENV"

      - name: Migrations (upgrade → no drift → downgrade → upgrade)
        if: matrix.backend == 'postgres'
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic downgrade base

      - name: Pytest + coverage (fail under 90%)
        run: >-
          uv run pytest
          --cov --cov-report=term-missing --cov-report=xml
          --junitxml=junit.xml

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Coverage (${{ matrix.backend }})"
            echo '```'
            uv run coverage report --format=text --skip-covered || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.backend }}
          path: |
            coverage.xml
            junit.xml

  docker:
    name: Docker image + compose e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: rl-arena:local
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start stack (postgres + redis + migrate + app)
        run: docker compose up -d --wait --wait-timeout 120
        env:
          GIT_SHA: ${{ github.sha }}

      - name: E2E smoke checks
        run: |
          set -euo pipefail
          expected=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          curl -fsS localhost:8000/healthz
          version=$(curl -fsS localhost:8000/api/v1/version)
          echo "$version"
          test "$(echo "$version" | jq -r .version)" = "$expected"
          test "$(echo "$version" | jq -r .commit)" = "${{ github.sha }}"
          health=$(curl -fsS localhost:8000/api/v1/health)
          echo "$health" | jq .
          test "$(echo "$health" | jq -r .status)" = ok
          # сквозной сценарий: залили агента в лигу и сразу получили его эвал
          id=$(curl -fsS -X POST localhost:8000/api/v1/agents -H 'content-type: application/json' \
            -d '{"name":"smoke","kind":"uploaded","checkpoint_uri":"s3://x"}' | jq -r .id)
          curl -fsS "localhost:8000/api/v1/agents/$id/evaluation" | jq .

      - name: Logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
